<html>
<head>
    <style>
        .main {
            font-family: Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .userName {
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="main">
    <div>
        你在 {{{application.name}}} 的密码（用户名 <span class="userName">{{{userId}}}</span>）已被重置为：
    </div>
    <div class="pwd">
        {{{pwd}}}
    </div>
    <div>
        请使用新密码<a href="{{application.url}}">登录</a>，登录后建议尽快修改密码。
    </div>
</div>
</body>
</html>
